user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Rate limiting zone for API protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Docker's embedded DNS: resolves upstreams lazily per-request instead of
    # once at boot, so nginx won't crash-loop if api/mediamtx aren't up yet.
    # Note: variable proxy_pass targets need $request_uri (or a regex
    # capture) appended explicitly — nginx skips its usual prefix rewrite.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Variable upstream targets (needed for the lazy-resolve above).
        set $api_upstream api;
        set $mediamtx_upstream mediamtx;
        set $prometheus_upstream prometheus;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # API reverse proxy
        location ^~ /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://$api_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Video assets proxy
        location ^~ /videos/ {
            proxy_pass http://$api_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # WebSocket connections
        location ^~ /ws/ {
            proxy_pass http://$api_upstream:8000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Prefix stripped on the upstream, so this needs a regex capture.
        location ~ ^/prometheus/(.*)$ {
            proxy_pass http://$prometheus_upstream:9090/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebRTC/WHEP proxy. Prefix stripped on the upstream; proxy_redirect
        # below re-adds it for the client (mediamtx's own redirect URLs lack it).
        location ~ ^/webrtc/(.*)$ {
            proxy_pass http://$mediamtx_upstream:8889/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect ~^http://[^/]+/(.*)$ $scheme://$http_host/webrtc/$1;
            proxy_redirect ~^/(.*)$ $scheme://$http_host/webrtc/$1;
            proxy_buffering off;
        }

        # HLS stream proxy
        location ~ ^/hls/(.*)$ {
            proxy_pass http://$mediamtx_upstream:8888/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            add_header Access-Control-Allow-Origin *;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static asset caching (immutable hashed files)
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|mp4|webp|webm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}

# WebRTC ICE TCP proxy — browsers connect to host:8189, forwarded to mediamtx:8189.
# `map` forces a variable target so `resolver` resolves it lazily (same fix as above).
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $server_addr $mediamtx_stream_upstream {
        default mediamtx;
    }

    server {
        listen 8189;
        proxy_pass $mediamtx_stream_upstream:8189;
    }
}
