# Created by Metrum AI for AMD

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "smartcity-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "amd-device-metrics"
    static_configs:
      - targets: ["amd-device-metrics-exporter:5000"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

